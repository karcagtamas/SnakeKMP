name: Deploy

on:
  push:
    tags:
      - 'v-*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Build Web Application (Wasm/JS)
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Build Desktop Application (Release JAR)
        run: ./gradlew :desktopApp:packageReleaseUberJarForCurrentOS

      - name: Package Web Distribution ZIP
        run: |
          cd webApp/build/dist/wasmJs/productionExecutable
          zip -r ../../../../snake-web-wasm.zip .
          cd ../../../../

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v-')
        with:
          generate_release_notes: true
          files: |
            desktopApp/build/compose/jars/*.jar
            snake-web-wasm.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
