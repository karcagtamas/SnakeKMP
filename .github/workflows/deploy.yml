name: Deploy

on:
  push:
    tags:
      - 'v-*'

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Build Desktop Application (Release JAR & Distribution)
        run: ./gradlew :desktopApp:packageReleaseUberJarForCurrentOS :desktopApp:packageReleaseDistributionForCurrentOS

      - name: Build Web Application (Wasm/JS)
        run: ./gradlew :webApp:wasmJsBrowserDistribution :webApp:jsBrowserDistribution

      - name: Package Web Distributions
        run: |
          cd webApp/build/dist/wasmJs/productionExecutable
          zip -r ../../../../../snake-web-wasm.zip .
          cd -
          cd webApp/build/dist/js/productionExecutable
          zip -r ../../../../../snake-web-js.zip .
          cd -

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v-')
        with:
          generate_release_notes: true
          files: |
            desktopApp/build/compose/jars/*-release.jar
            desktopApp/build/compose/jars/*.jar
            desktopApp/build/compose/binaries/main-release/deb/*.deb
            snake-web-wasm.zip
            snake-web-js.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
